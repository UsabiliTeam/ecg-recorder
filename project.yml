name: ECGRecorder
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
packages:
  PolarBleSdk:
    url: https://github.com/polarofficial/polar-ble-sdk.git
    exactVersion: 8.3.0
targets:
  ECGRecorder:
    type: application
    platform: iOS
    sources:
      - ECGRecorder
      - Shared
      - path: media/bell.wav
        buildPhase: resources
    dependencies:
      - package: PolarBleSdk
      - target: ECGRecorderWidgets   # Live Activity; needs a team selected in Xcode
    info:
      path: ECGRecorder/Info.plist
      properties:
        CFBundleDisplayName: ECG Recorder
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSSupportsLiveActivities: true
        UIBackgroundModes: [bluetooth-central]
        NSBluetoothAlwaysUsageDescription: ECG Recorder connects to Polar H10 devices to record ECG, heart rate and motion data.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ecgrecorder
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
  ECGRecorderWidgets:
    type: app-extension
    platform: iOS
    sources: [ECGRecorderWidgets, Shared]
    info:
      path: ECGRecorderWidgets/Info.plist
      properties:
        CFBundleDisplayName: ECG Recorder
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ecgrecorder.widgets
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
  ECGRecorderTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ECGRecorderTests]
    dependencies:
      - target: ECGRecorder
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
schemes:
  ECGRecorder:
    build:
      targets:
        ECGRecorder: all
    test:
      targets: [ECGRecorderTests]
